[project]
name = "ledgerline-finance-agent"
version = "0.1.0"
description = "A synthetic-data finance analytics agent with a FastAPI API."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "logfire[httpx]>=2.0,<6.0",
    "opik>=1.8,<2.0",
    "pydantic-ai>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<2.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]